<style>
/* ================= 基础 ================= */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0a0a0b;--bg1:#101013;
  --panel:rgba(24,25,32,.78);--panel2:rgba(255,255,255,.075);
  --brd:rgba(255,255,255,.085);--brd2:rgba(255,255,255,.16);
  --txt:#f0f1f4;--txt2:#a9aeb8;--txt3:#686d78;
  --gold:#e7c27d;--good:#7fd8a0;--bad:#e08a8a;
  --ease:cubic-bezier(.22,1,.36,1);
  --rowhl:rgba(255,255,255,.028);--rowbrd:rgba(255,255,255,.045);--hov1:rgba(255,255,255,.05);--hov2:rgba(255,255,255,.065);
  --colbg:#101116;--mediabg:#0c0d11;--tablebg:rgba(15,16,21,.92);
  --popbg:rgba(19,20,25,.98);--panelbg:#0f1015;--panelhead:rgba(15,16,21,.9);--floatbg:rgba(14,15,19,.72);
  --maskbg:rgba(5,6,9,.62);--lb-bg:rgba(6,7,10,.96);--toastbg:rgba(22,23,29,.94);
  --track:rgba(255,255,255,.12);--knob:#c9ccd4;--knobon:#141312;--knobtxt:#141312;
  --sbar:rgba(255,255,255,.13);--scbar:rgba(255,255,255,.07);
  --ch-txt:#a9aeb8;--ch-grid:rgba(255,255,255,.07);--ch-tipbg:#181a20;--ch-tipbrd:rgba(255,255,255,.12);
  --ch-avgln:rgba(255,255,255,.28);--ch-avgbg:rgba(255,255,255,.05);
  --blob1:rgba(64,98,255,.17);--blob2:rgba(20,170,150,.14);
  --warn:#e9c46a;--warnbrd:rgba(233,196,106,.3);
  --font:Inter,-apple-system,"SF Pro Text","Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
html{background:linear-gradient(180deg,var(--bg0),var(--bg1) 140%);overflow-y:scroll;scrollbar-gutter:stable}
html.boot main{opacity:0}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
body{font-family:var(--font);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
compare-grid,detail-drawer{display:block}
input{font:inherit;color:inherit}
ul{list-style:none}
a{color:inherit}
h1,h2,h3,h4{font-weight:600}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
:focus-visible{outline:2px solid #6f9fff;outline-offset:2px;border-radius:6px}
::selection{background:rgba(111,159,255,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--sbar);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* 背景缓动光斑 */
/* 背景光斑：用径向渐变自带的软边代替 filter:blur——模糊层每帧重算 90px blur 是滚动掉帧的最大来源 */
.bgfx{position:fixed;inset:-20%;z-index:-1;pointer-events:none;opacity:.5;contain:strict}
.bgfx::before{content:"";position:absolute;width:46vw;height:46vw;left:-6%;top:-12%;border-radius:50%;background:radial-gradient(circle,var(--blob1),transparent 42%);filter:blur(46px);will-change:transform;animation:drift1 46s ease-in-out infinite alternate}
.bgfx::after{content:"";position:absolute;width:52vw;height:52vw;right:-10%;bottom:-18%;border-radius:50%;background:radial-gradient(circle,var(--blob2),transparent 42%);filter:blur(46px);will-change:transform;animation:drift2 52s ease-in-out infinite alternate}
/* 顶部滚动进度线：scroll-timeline 驱动，纯合成器动画，不支持该特性的浏览器自动隐藏 */
.sprog{position:fixed;top:0;left:0;right:0;height:2px;z-index:400;pointer-events:none}
.sprog i{display:block;height:100%;transform-origin:left center;transform:scaleX(0);background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 45%,#fff 55%))}
@supports (animation-timeline: scroll()){
  .sprog i{animation:sprogrow linear both;animation-timeline:scroll(root block)}
  @keyframes sprogrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}
@keyframes drift1{to{transform:translate(12vw,9vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-9vw,-11vh) scale(1.08)}}

/* ================= 布局 ================= */
main,.app-header,.app-footer{width:min(1280px,100%);margin:0 auto;padding:0 clamp(14px,3vw,28px)}
.app-header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding-top:26px;padding-bottom:10px}
.brand h1{font-size:clamp(19px,2.4vw,26px);letter-spacing:.01em}
.brand p{color:var(--txt3);font-size:12px;margin-top:3px}
.hd-actions{display:flex;gap:8px;flex:none}
.ghost-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--brd);border-radius:10px;background:var(--panel);color:var(--txt2);font-size:13px;transition:border-color .25s var(--ease),color .25s,background .25s,transform .15s var(--ease)}
.ghost-btn:hover{color:var(--txt);border-color:var(--brd2);background:var(--panel2)}
.ghost-btn:active{transform:scale(.97)}
.tl-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 18px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:26px 2px 12px}
.sec-head h2{font-size:16px}
.sec-sub{color:var(--txt3);font-size:12px}
.app-footer{color:var(--txt3);font-size:12px;padding:34px 0 40px;text-align:center}
.btn-min{padding:7px 14px;border-radius:9px;background:var(--panel2);border:1px solid var(--brd);font-size:12.5px;transition:transform .15s var(--ease),background .2s}
.btn-min:active{transform:scale(.96)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;color:var(--txt2);transition:background .2s,color .2s,transform .15s var(--ease)}
.icon-btn:hover{background:var(--panel2);color:var(--txt)}
.icon-btn:active{transform:scale(.94)}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--brd);color:var(--txt2);font-size:12px;transition:color .2s var(--ease),border-color .2s var(--ease),background .2s var(--ease);white-space:nowrap}
.chip:hover{border-color:var(--brd2);color:var(--txt)}
.chip.on{background:var(--panel2);color:var(--txt);border-color:var(--brd2)}
.chip:active{transform:scale(.95)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;border:1px solid var(--brd);color:var(--txt2);white-space:nowrap}
.badge.sale{color:var(--good);border-color:rgba(127,216,160,.25)}
.badge.unreleased{color:var(--warn);border-color:var(--warnbrd)}
.badge.eol{color:var(--bad);border-color:rgba(224,138,138,.25)}

/* ================= 选择槽 ================= */
phone-selector{position:relative;display:block}
.ps-slot{width:100%;display:flex;align-items:center;gap:12px;padding:11px 13px;min-height:68px;border:1px solid var(--brd);border-radius:15px;background:var(--panel);text-align:left;transition:border-color .25s var(--ease),background .25s,box-shadow .3s,transform .15s var(--ease)}
.ps-slot:hover{border-color:var(--brd2);background:var(--panel2)}
.ps-slot:active{transform:scale(.985)}
.ps-slot.filled{border-color:color-mix(in srgb,var(--ph,#888) 38%,transparent)}
.ps-slot.flash{box-shadow:0 0 0 1px var(--ph,#888),0 0 22px color-mix(in srgb,var(--ph,#888) 35%,transparent)}
.ps-plus{flex:none;width:38px;height:38px;border-radius:11px;border:1px dashed var(--brd2);display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:16px}
.ps-emp b{display:block;font-size:13.5px;font-weight:600}
.ps-emp span{font-size:12px;color:var(--txt3)}
.ps-th{flex:none;height:42px;display:flex;align-items:center}
.ps-th .mk{height:100%}
.ps-th .th-img{height:100%;width:auto;border-radius:8px;object-fit:cover}
.ps-in{flex:1;min-width:0}
.ps-in b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-in>span{display:block;font-size:12px;color:var(--txt3);margin-top:1px}
.ps-x{flex:none;display:flex;color:var(--txt3);padding:6px;border-radius:8px;transition:color .2s,background .2s}
.ps-x:hover{color:var(--bad);background:rgba(224,138,138,.1)}
.ps-pop{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:90;background:var(--popbg);border:1px solid var(--brd2);border-radius:16px;box-shadow:0 30px 70px -20px rgba(0,0,0,.75);padding:10px}
.ps-search{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--brd);border-radius:10px;background:var(--hov1);color:var(--txt3);font-size:14px}
.ps-search input{flex:1;background:none;border:0;outline:none;color:var(--txt);min-width:0}
.ps-search input::placeholder{color:var(--txt3)}
.ps-brands{display:flex;gap:6px;flex-wrap:wrap;padding:9px 2px 8px}
.ps-list{max-height:min(330px,52vh);overflow-y:auto;scrollbar-gutter:stable;overscroll-behavior:contain;margin-top:2px}
.ps-item{width:100%;display:flex;align-items:center;gap:11px;padding:8px 9px;border-radius:11px;text-align:left;transition:background .18s}
.ps-item:hover,.ps-item.kb{background:var(--hov2)}
.ps-item.off{opacity:.38}
.ps-item.off .ps-item-add{font-size:11px;color:var(--txt3)}
.ps-item-th{flex:none;height:40px;width:26px;display:flex;align-items:center}
.ps-item-th .mk{height:100%}
.ps-item-th .th-img{height:100%;width:26px;object-fit:cover;border-radius:6px}
.ps-item-in{flex:1;min-width:0}
.ps-item-in b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-item-in span{display:block;font-size:11.5px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-item-end{flex:none;text-align:right;font-size:12px;color:var(--txt2);font-variant-numeric:tabular-nums}
.ps-list .empty{padding:22px 0;text-align:center;color:var(--txt3);font-size:12.5px}

/* ================= 对比表 ================= */
.cg-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:26px 2px 12px}
.cg-title{font-size:16px}
.cg-spacer{flex:1}
.cg-sort{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--txt3);font-size:12px}
.cg-wrap{border:1px solid var(--brd);border-radius:var(--r);background:var(--tablebg);overflow:auto;overscroll-behavior-x:contain;contain:paint}
.cg-grid{display:grid;grid-template-columns:var(--cols);min-width:min-content;font-size:13px}
.cg-corner{position:sticky;left:0;z-index:3;padding:12px;font-size:12px;color:var(--txt3);background:var(--colbg);box-shadow:inset -14px 0 12px -12px rgba(0,0,0,.25)}
.cg-group{display:flex;align-items:center;gap:7px;padding:10px 12px;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--txt2);background:var(--rowhl);cursor:pointer;user-select:none;transition:background .2s}
.cg-group:hover{background:rgba(255,255,255,.05)}
.cg-group .ic{transition:transform .35s var(--ease);font-size:12px}
.cg-group.col .ic{transform:rotate(90deg)}
.cg-label{position:sticky;left:0;z-index:2;padding:11px 12px;color:var(--txt2);background:var(--colbg);box-shadow:inset -14px 0 12px -12px rgba(0,0,0,.25)}
.cg-ph{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--brd);cursor:pointer;transition:background .2s}
.cg-ph:hover{background:rgba(255,255,255,.035)}
.cg-ph-th{flex:none;height:38px;width:24px;display:flex}
.cg-ph-th .mk{height:100%}
.cg-ph-th .th-img{height:100%;width:24px;object-fit:cover;border-radius:6px}
.cg-ph-in{flex:1;min-width:0}
.cg-ph-in b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg-ph-in span{font-size:11.5px;color:var(--txt3);font-variant-numeric:tabular-nums}
.cg-ph-x{flex:none;color:var(--txt3);padding:5px;border-radius:7px;opacity:0;transition:opacity .2s,color .2s,background .2s}
.cg-ph:hover .cg-ph-x,.cg-ph-x:focus-visible{opacity:1}
.cg-ph-x:hover{color:var(--bad);background:rgba(224,138,138,.1)}
.cg-cell{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:11px 12px;border-bottom:1px solid var(--rowbrd);min-height:46px;font-variant-numeric:tabular-nums}
.cg-cell.wide .cg-val{-webkit-line-clamp:3}
.cg-val{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45;color:var(--txt)}
.cg-cell.best .cg-val{color:var(--gold);font-weight:600}
.cg-cell.worst{opacity:.48}
.cg-bar{display:block;height:3px;border-radius:2px;background:var(--scbar);overflow:hidden;margin-top:2px}
.cg-bar i{display:block;height:100%;border-radius:inherit;background:var(--ph,#888);transform-origin:left center;transform:scaleX(0);transition:transform .7s var(--ease)}
.cg-cell.best .cg-bar i{background:var(--gold)}
.cg-empty{grid-column:1/-1;padding:46px 20px;text-align:center;color:var(--txt3);font-size:13px}

/* diff-toggle */
diff-toggle{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
dt-track,.dt-track{width:36px;height:20px;border-radius:99px;background:var(--track);position:relative;transition:background .3s var(--ease);flex:none}
.dt-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--knob);transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .3s}
diff-toggle[aria-checked="true"] .dt-track{background:var(--gold)}
diff-toggle[aria-checked="true"] .dt-knob{transform:translateX(16px);background:var(--knobon)}
.dt-label{font-size:12.5px;color:var(--txt2)}
diff-toggle[aria-checked="true"] .dt-label{color:var(--gold)}

/* ================= 机型卡片 ================= */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
.card{position:relative;border:1px solid var(--brd);border-radius:var(--r);background:var(--panel);overflow:hidden;cursor:pointer;transform-style:preserve-3d;transition:transform .5s var(--ease),border-color .3s,box-shadow .4s;will-change:transform;content-visibility:auto;contain-intrinsic-size:auto 460px}
.card:hover{border-color:var(--brd2);box-shadow:0 26px 54px -22px rgba(0,0,0,.65)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(240px circle at var(--gx,50%) var(--gy,50%),color-mix(in srgb,var(--ph,#fff) 10%,transparent),transparent 65%)}
.card:hover::after{opacity:1}
.card-media{position:relative;height:172px;display:flex;align-items:center;justify-content:center;background:radial-gradient(95% 80% at 50% 26%,color-mix(in srgb,var(--ph,#888) 10%,transparent),transparent 72%),var(--mediabg)}
.card-media .mk{height:146px;transform:rotate(-3deg)}
.card-media .th-img{max-height:150px;max-width:70%;object-fit:contain;border-radius:12px}
.card-badge{position:absolute;top:10px;left:10px}
.card-add{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--brd2);background:var(--floatbg);display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:14px;transition:color .25s var(--ease),border-color .25s var(--ease),background .25s var(--ease),transform .25s var(--ease)}
.card-add:hover{color:var(--txt);border-color:var(--ph,#fff);transform:scale(1.1)}
.card-add.on{color:#141312;background:var(--ph,#fff);border-color:transparent}
.card-add:active{transform:scale(.92)}
.card-body{padding:13px 15px 15px}
.card-name{font-size:14.5px;font-weight:600}
.card-meta{font-size:12px;color:var(--txt3);margin-top:2px}
.card-price{margin-top:7px;font-size:14px;font-variant-numeric:tabular-nums}
.card-now{margin-left:8px;font-size:12px;color:var(--good)}
.card-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.card-chips span{font-size:11px;color:var(--txt2);padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--brd);font-variant-numeric:tabular-nums}

/* ================= CSS 手机示意 ================= */
.mk{position:relative;aspect-ratio:9/19;height:100%;flex:none}
.mk-frame{position:absolute;inset:0;border-radius:var(--mkr,13%);background:linear-gradient(150deg,#26292f,#15171b 55%,#1f2227);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 1px 2px rgba(255,255,255,.2),0 18px 36px -16px rgba(0,0,0,.8);overflow:hidden}
.mk-sheen{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(130% 90% at 18% -5%,rgba(255,255,255,.06),transparent 55%);background:radial-gradient(130% 90% at 18% -5%,var(--phA,rgba(255,255,255,.06)),transparent 60%);mix-blend-mode:screen}
.mk-screen{position:absolute;inset:3%;border-radius:8.5%;background:radial-gradient(120% 90% at 22% 12%,#0b0d12,#05060a 72%);background:radial-gradient(120% 90% at 22% 12%,color-mix(in srgb,var(--ph,#666) 40%,#05060a),#05060a 72%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);overflow:hidden}
.mk-screen::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(125deg,transparent 38%,rgba(255,255,255,.065) 46%,transparent 58%)}
.mk-island{position:absolute;top:2.7%;left:50%;transform:translateX(-50%);width:33%;height:3.3%;border-radius:99px;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.mk-island::after{content:"";position:absolute;right:11%;top:50%;transform:translateY(-50%);width:26%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#22262c,#0a0b0e)}
.mk-punch{position:absolute;top:2.8%;left:50%;transform:translateX(-50%);width:6.5%;aspect-ratio:1;border-radius:50%;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),inset 0 0 3px rgba(85,100,125,.55)}
.mk-mod{position:absolute;background:linear-gradient(160deg,#2c2f35,#17181c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 2px 5px rgba(255,255,255,.07),0 3px 9px rgba(0,0,0,.5)}
.mk-lens{position:absolute;border-radius:50%;background:radial-gradient(circle at 34% 30%,#4a5059 0%,#252930 30%,#0a0b0e 72%);box-shadow:inset 0 0 0 2px rgba(150,160,175,.17),inset 0 2px 3px rgba(255,255,255,.13),0 1px 3px rgba(0,0,0,.65)}
.mk-lens::after{content:"";position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 58% 60%,rgba(110,150,215,.28),rgba(16,20,30,.92) 62%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.7)}
.mk-lens::before{content:"";position:absolute;top:13%;left:17%;width:24%;height:15%;border-radius:50%;background:rgba(255,255,255,.32);filter:blur(.5px)}
.mk-flash{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3d8,#c9a35f 70%);box-shadow:0 0 4px rgba(255,228,164,.4)}
/* 苹果：左上圆角方岛 三角排布 */
.mk-t-apple .mk-mod{top:4.5%;left:7%;width:41%;aspect-ratio:1;border-radius:25%}
.mk-t-apple .mk-lens{width:33%;aspect-ratio:1}
.mk-t-apple .l1{top:12%;left:13%}
.mk-t-apple .l2{top:12%;right:13%}
.mk-t-apple .l3{bottom:11%;left:33.5%}
.mk-t-apple .mk-flash{width:8%;aspect-ratio:1;bottom:16%;right:19%}
/* 华为：居中大圆环 */
.mk-t-huawei .mk-mod{top:6.5%;left:50%;transform:translateX(-50%);width:52%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 30%,#32363c,#17181c 72%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.08),inset 0 0 0 7px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.5)}
.mk-t-huawei .mk-lens{width:26%;aspect-ratio:1}
.mk-t-huawei .l1{top:15%;left:22%}
.mk-t-huawei .l2{top:15%;right:22%}
.mk-t-huawei .l3{bottom:13%;left:37%}
.mk-t-huawei .mk-flash{width:9%;aspect-ratio:1;top:44%;left:45.5%}
/* 荣耀：居中圆 + 双环 */
.mk-t-honor .mk-mod{top:6%;left:50%;transform:translateX(-50%);width:48%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 28%,#2f3339,#16171b 72%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.1),inset 0 0 0 9px rgba(0,0,0,.28),0 3px 9px rgba(0,0,0,.5)}
.mk-t-honor .mk-lens{width:27%;aspect-ratio:1}
.mk-t-honor .l1{top:16%;left:18%}
.mk-t-honor .l2{top:16%;right:18%}
.mk-t-honor .l3{bottom:14%;left:36.5%}
.mk-t-honor .mk-flash{width:9%;aspect-ratio:1;top:45%;left:45.5%}
/* 小米：居中圆 + 背屏 */
.mk-t-xiaomi .mk-mod{top:5%;left:50%;transform:translateX(-50%);width:54%;aspect-ratio:1;border-radius:50%}
.mk-ring{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle at 32% 26%,#12151b,#060709 76%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 14px rgba(60,80,120,.25)}
.mk-t-xiaomi .mk-lens{width:21%;aspect-ratio:1}
.mk-t-xiaomi .l1{top:2.5%;left:39.5%}
.mk-t-xiaomi .l2{top:33%;left:3%}
.mk-t-xiaomi .l3{top:33%;right:3%}
.mk-t-xiaomi .mk-flash{width:8%;aspect-ratio:1;bottom:6%;left:46%}
/* iQOO：左上竖向胶囊 */
.mk-t-iqoo .mk-mod{top:4.5%;left:7%;width:27%;height:16%;border-radius:30%}
.mk-t-iqoo .mk-lens{width:42%;aspect-ratio:1}
.mk-t-iqoo .l1{top:7%;left:11%}
.mk-t-iqoo .l2{bottom:7%;left:11%}
.mk-t-iqoo .mk-flash{width:16%;aspect-ratio:1;top:42%;right:9%}
/* 红米：左上方块 + 大主摄 */
.mk-t-redmi .mk-mod{top:4.5%;left:7%;width:36%;aspect-ratio:1;border-radius:24%}
.mk-t-redmi .mk-lens{aspect-ratio:1}
.mk-t-redmi .l1{width:48%;top:26%;left:26%}
.mk-t-redmi .l2{width:19%;top:9%;right:9%}
.mk-t-redmi .l3{width:19%;bottom:9%;right:9%}
.mk-t-redmi .mk-flash{width:10%;aspect-ratio:1;bottom:11%;left:11%}
/* 一加：居中圆 三角 */
.mk-t-oneplus .mk-mod{top:5.5%;left:50%;transform:translateX(-50%);width:46%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2f333a,#16171b 74%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.09),inset 0 0 0 7px rgba(0,0,0,.3),0 3px 9px rgba(0,0,0,.5)}
.mk-t-oneplus .mk-lens{width:29%;aspect-ratio:1}
.mk-t-oneplus .l1{top:9%;left:35.5%}
.mk-t-oneplus .l2{bottom:14%;left:14%}
.mk-t-oneplus .l3{bottom:14%;right:14%}
.mk-t-oneplus .mk-flash{width:9%;aspect-ratio:1;top:42%;left:45.5%}
/* 侧面 */
.mk-v-side{display:flex;align-items:center;justify-content:center}
.mk-sbump{position:absolute;top:3%;left:50%;transform:translateX(-50%);width:22%;height:6%;border-radius:6px;background:linear-gradient(90deg,#2b2e34,#191b1f);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.mk-sbar{position:relative;height:92%;width:4.5%;border-radius:8px;background:linear-gradient(90deg,#3c4048,#1c1e23 45%,#2c2f35);box-shadow:0 0 0 1px rgba(255,255,255,.09),0 16px 34px -14px rgba(0,0,0,.85)}
.mk-sbar::before{content:"";position:absolute;left:15%;top:2%;bottom:2%;width:10%;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04))}
.mk-sbtn{position:absolute;width:130%;height:3.5%;border-radius:3px;background:#141519;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22)}
.mk-sbtn.a{top:27%;right:-18%}
.mk-sbtn.b{top:34%;right:-18%}
/* 细节 */
.mk-v-detail{display:flex;align-items:center;justify-content:center}
.mk-dglow{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,var(--phA,rgba(255,255,255,.12)),transparent 68%);filter:blur(4px)}
.mk-dwrap{position:absolute;inset:0}
.mk-dwrap .mk-mod{top:15%;left:50%;transform:translateX(-50%);width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 30%,#33373d,#141519 74%)}
/* 主图：正背双机 */
.ig-hero{display:flex;align-items:center;justify-content:center;height:100%;width:100%}
.ig-hero .mk{height:94%}
.ig-hero .mk-v-back{transform:rotate(-8deg) translateX(10%) translateY(3%);z-index:1}
.ig-hero .mk-v-front{transform:rotate(6deg) translateX(-10%);margin-left:-16%;z-index:2}

/* ================= 详情抽屉 ================= */
.dd-mask{position:fixed;inset:0;z-index:110;background:var(--maskbg);opacity:0}
.dd-panel{position:fixed;top:0;right:0;bottom:0;z-index:120;width:min(480px,100vw);background:var(--panelbg);border-left:1px solid var(--brd);box-shadow:-30px 0 60px -30px rgba(0,0,0,.8);display:flex;flex-direction:column;will-change:transform}
.dd-head{flex:none;display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--brd);background:var(--panelhead)}
.dd-headin{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.dd-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ph,#888);box-shadow:0 0 12px var(--ph,#888)}
.dd-name{font-size:17px;font-weight:700;letter-spacing:.01em}
.dd-meta{font-size:12px;color:var(--txt3);margin-top:2px}
.dd-close{flex:none;width:34px;height:34px;border:1px solid var(--brd);border-radius:10px}
.dd-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 18px 26px}
.dd-sec{margin-top:20px}
.dd-sec h3{font-size:12.5px;font-weight:600;letter-spacing:.12em;color:var(--txt2);margin-bottom:11px}
.dd-note{font-size:11.5px;color:var(--txt3);margin-top:10px;line-height:1.6}
.dd-stats{container-type:inline-size;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@container (max-width:440px){.dd-stats stat-card{grid-column:span 2}}
stat-card{display:block;border:1px solid var(--brd);border-radius:13px;background:var(--panel);padding:11px 12px}
.sc-label{font-size:11px;color:var(--txt3);letter-spacing:.04em}
.sc-val{margin-top:5px;font-size:16.5px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-unit{font-size:11px;color:var(--txt2);font-weight:400;margin-left:2px}
.sc-bar{display:block;height:3px;border-radius:2px;background:var(--scbar);margin-top:8px;overflow:hidden}
.sc-bar i{display:block;height:100%;border-radius:inherit;background:var(--ph,#888)}
.dd-viz{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
@media (max-width:430px){.dd-viz{grid-template-columns:1fr}}
radar-chart,bar-chart,donut-chart{display:block}
.ch-card{border:1px solid var(--brd);border-radius:14px;background:var(--panel);padding:12px 13px}
.ch-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ch-top span{font-size:12px;color:var(--txt2)}
.ch-body{position:relative}
radar-chart .ch-body{height:238px}
bar-chart .ch-body{height:224px}
donut-chart .ch-body{height:170px}
.dd-pc{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:430px){.dd-pc{grid-template-columns:1fr}}
.pc-col{border:1px solid var(--brd);border-radius:13px;background:var(--panel);padding:12px 13px}
.pc-col h4{font-size:12px;margin-bottom:9px}
.pc-pro h4{color:var(--good)}
.pc-con h4{color:var(--bad)}
.pc-col li{position:relative;padding:4px 0 4px 13px;font-size:12.5px;color:#c9cdd4;line-height:1.5}
.pc-col li::before{content:"";position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%}
.pc-pro li::before{background:var(--good)}
.pc-con li::before{background:var(--bad)}
.dd-exc{font-size:12.5px;color:var(--txt2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.dd-exc.open{display:block}
.dd-colors{display:flex;gap:7px;flex-wrap:wrap}
.dd-colors span{font-size:12px;padding:5px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--brd);color:var(--txt2)}
.dd-foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--txt3)}
.dd-foot a{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--brd);border-radius:10px;background:var(--panel);color:var(--txt2);text-decoration:none;transition:color .2s,border-color .2s,background .2s}
.dd-foot a:hover{color:var(--txt);border-color:var(--brd2)}

/* ================= 图库 ================= */
image-gallery{display:block}
.ig-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.ig-tabs{display:flex;gap:5px;flex-wrap:wrap}
.ig-tab{padding:5px 11px;border-radius:99px;font-size:12px;color:var(--txt3);border:1px solid transparent;transition:color .2s var(--ease),border-color .2s var(--ease),background .2s var(--ease)}
.ig-tab:hover{color:var(--txt2)}
.ig-tab.on{color:var(--txt);background:var(--panel2);border-color:var(--brd)}
.ig-wrap{position:relative;border:1px solid var(--brd);border-radius:16px;background:radial-gradient(90% 75% at 50% 30%,var(--phB,rgba(255,255,255,.04)),transparent 72%),var(--mediabg);height:288px;overflow:hidden;touch-action:pan-y}
.ig-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:zoom-in;transform:translateX(var(--drag,0px));transition:transform .45s var(--ease)}
.ig-stage.grabbing{transition:none;cursor:grabbing}
.ig-stage .mk{height:86%}
.ig-hero .mk{height:94%}
.ig-imgw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.ig-img{max-height:100%;max-width:86%;object-fit:contain;border-radius:12px;opacity:0;filter:blur(18px);transform:scale(1.05);transition:opacity .55s,filter .6s,transform .6s var(--ease)}
.ig-img.ok{opacity:1;filter:blur(0);transform:none}
.ig-noimg{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--txt3);background:var(--floatbg);border:1px solid var(--brd);padding:4px 9px;border-radius:99px;backdrop-filter:blur(6px)}
.ig-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:34px;height:34px;border-radius:50%;background:var(--floatbg);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;color:var(--txt2);transition:color .2s var(--ease),border-color .2s var(--ease)}
.ig-nav:hover{color:var(--txt);border-color:var(--brd2)}
.ig-nav:active{transform:translateY(-50%) scale(.92)}
.ig-prev{left:10px}
.ig-next{right:10px}
.ig-repp{margin-top:10px;border:1px solid var(--brd);border-radius:13px;background:var(--panel);padding:12px}
.ig-rep-t{font-size:12px;color:var(--txt3);margin-bottom:9px}
.ig-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12px;color:var(--txt2)}
.ig-row span{flex:none;width:34px}
.ig-row input{flex:1;min-width:0;background:rgba(255,255,255,.045);border:1px solid var(--brd);border-radius:8px;padding:7px 10px;outline:none;font-size:12px}
.ig-row input:focus{border-color:var(--brd2)}
.ig-rep-a{display:flex;gap:8px;margin-top:4px}

/* 灯箱 */
.lb{position:fixed;inset:0;z-index:200;background:var(--lb-bg);display:flex;align-items:center;justify-content:center}
.lb-stage{height:min(74vh,700px);display:flex;align-items:center;justify-content:center;position:relative;touch-action:pan-y}
.lb-stage .mk{height:100%}
.lb-stage .ig-hero .mk{height:94%}
.lb-stage .ig-imgw{padding:0}
.lb-stage .ig-img{max-height:100%;max-width:88vw}
.lb-x{position:absolute;top:18px;right:20px;width:40px;height:40px;border-radius:50%;border:1px solid var(--brd);background:var(--floatbg);display:flex;align-items:center;justify-content:center;font-size:16px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--brd);background:var(--floatbg);display:flex;align-items:center;justify-content:center;font-size:17px;transition:color .2s,border-color .2s}
.lb-nav:hover{border-color:var(--brd2)}
.lb-prev{left:18px}
.lb-next{right:18px}
.lb-info{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:var(--txt2);font-size:12.5px}
.lb-count{position:absolute;top:28px;left:24px;color:var(--txt3);font-size:12.5px;font-variant-numeric:tabular-nums}

/* toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,14px);z-index:300;background:var(--toastbg);border:1px solid var(--brd2);color:var(--txt);font-size:13px;padding:10px 18px;border-radius:99px;box-shadow:0 18px 40px -14px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .tl-bar{grid-template-columns:1fr}
  .app-header{align-items:center}
  .cg-grid{font-size:12.5px}
  .ig-wrap{height:250px}
}

/* ================= 浅色主题 ================= */
html[data-theme="light"]{
  --bg0:#f4f5f7;--bg1:#e9ebef;
  --panel:rgba(255,255,255,.85);--panel2:rgba(255,255,255,.95);
  --brd:rgba(15,20,30,.10);--brd2:rgba(15,20,30,.22);
  --txt:#17181c;--txt2:#4c515b;--txt3:#8a8f99;
  --gold:#a9741c;--good:#178a4c;--bad:#c24545;
  --rowhl:rgba(15,20,30,.035);--rowbrd:rgba(15,20,30,.07);--hov1:rgba(15,20,30,.05);--hov2:rgba(15,20,30,.09);
  --colbg:#eef0f4;--mediabg:#e7e9ee;--tablebg:rgba(255,255,255,.92);
  --popbg:rgba(255,255,255,.97);--panelbg:#fbfbfd;--panelhead:rgba(251,251,253,.94);--floatbg:rgba(255,255,255,.88);
  --maskbg:rgba(30,34,44,.45);--lb-bg:rgba(240,241,244,.97);--toastbg:rgba(255,255,255,.97);
  --track:rgba(15,20,30,.16);--knob:#fff;--knobon:#17181c;
  --sbar:rgba(15,20,30,.22);--scbar:rgba(15,20,30,.10);
  --ch-txt:#4c515b;--ch-grid:rgba(15,20,30,.10);--ch-tipbg:#ffffff;--ch-tipbrd:rgba(15,20,30,.12);
  --ch-avgln:rgba(15,20,30,.3);--ch-avgbg:rgba(15,20,30,.05);
  --blob1:rgba(64,98,255,.10);--blob2:rgba(20,170,150,.10);
  --warn:#9a6b00;--warnbrd:rgba(154,107,0,.28);
}
html[data-theme="light"] .bgfx{opacity:.8}
html[data-theme="light"] .card::after{opacity:0}
html[data-theme="light"] .card-media .mk-frame,html[data-theme="light"] .mk-frame{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 1px 2px rgba(255,255,255,.2),0 14px 28px -14px rgba(30,40,60,.35)}
html[data-theme="light"] .dd-panel{box-shadow:-30px 0 70px -40px rgba(30,40,60,.4)}
</style>

<div class="bgfx" aria-hidden="true"></div>
<div class="sprog" aria-hidden="true"><i></i></div>

    <p id="subLine">载入数据…</p>
  </div>

    <button id="btnReset" class="ghost-btn" hidden>恢复内置数据</button>
    <button id="btnTheme" class="ghost-btn" aria-label="切换浅色 / 深色主题"></button>
    <button id="btnImport" class="ghost-btn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>导入 CSV</button>
    <input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
  </div>
</header>
<main>
  <section class="tl-bar" aria-label="选择对比机型">

    <phone-selector data-slot="1"></phone-selector>

  </section>

    <compare-grid id="cmp"></compare-grid>
  </section>
  <section>
    <div class="sec-head"><h2>全部机型</h2><p class="sec-sub" id="gSub"></p></div>
    <div class="cards" id="cards"></div>
  </section>
</main>
<footer class="app-footer">数据来自本地 CSV · 参数以官方发布为准 · 机型图为 CSS 示意稿，可在详情中替换为真实图片链接</footer>
<detail-drawer id="drawer"></detail-drawer>
<div class="toast" id="toast" role="status"></div>
<noscript>需要启用 JavaScript。</noscript>
<script type="module">
/* ============ 工具 ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmtInt=v=>Math.round(v).toLocaleString('zh-CN');
const fmtNum=v=>String(Number((+v).toFixed(2)));
const hexA=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const mpText=v=>v==null?'—':(v>=100?(v/100)+'亿':v+'00万');
const wan=v=>v>=1e4?(Math.round(v/1e3)/10)+'万':String(v);
function countTo(el,val,fmt,dur=900){
  if(val==null||!isFinite(val))return;
  if(RM||!window.requestAnimationFrame){el.textContent=fmt(val);return}
  const t0=performance.now();let done=0;
  const fin=()=>{if(done++)return;el.textContent=fmt(val)};
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,4);el.textContent=fmt(val*e);if(k<1)requestAnimationFrame(step);else fin()};
  requestAnimationFrame(step);setTimeout(fin,dur+200);
}
const LS={
  get(k,d){try{const v=localStorage.getItem('pc26:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('pc26:'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('pc26:'+k)}catch(e){}}
};
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}

/* ============ 图标 ============ */
const I={
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  chevl:'<path d="M15 6l-6 6 6 6"/>',
  chevr:'<path d="M9 6l6 6-6 6"/>',
  replay:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',

function parseCSV(text){
  const s=String(text).replace(/^\uFEFF/,'');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(q){ if(c==='"'){ if(s[i+1]==='"'){f+='"';i++}else q=false } else f+=c }
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'){row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else if(c!=='\r')f+=c;
  }
  row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
}
function rowsToObjects(rows){
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{
    const o={};headers.forEach((h,i)=>{if(h)o[h]=(r[i]||'').trim()});
    o.__cols=headers; return o;
  });
}
const C=(o,...names)=>{for(const n of names){const k=(o.__cols||[]).find(h=>h&&h.includes(n));if(k&&o[k]!=='')return o[k]}return ''};

const clean=v=>{const s=String(v??'').trim();return !s||NULL_RE.test(s)?null:s};
const firstNum=v=>{const m=String(v??'').match(/-?\d+(?:\.\d+)?/);return m?+m[0]:null};

function camShort(raw){
  const s=clean(raw);if(!s)return null;
  const parts=[];
  const mp=s.match(/2亿|(\d+(?:\.\d+)?)万|(\d+)MP/);if(mp)parts.push(mp[0]);
  const ap=s.match(/[fF]\/[\d.]+/)||s.match(/[fF][\d.]+\s*-\s*[fF]?[\d.]+/)||s.match(/(?:^|\s|焦)([fF][\d.]+)(?=\s|$)/);
  if(ap)parts.push((ap[0].trim().split(/\s+/)[0]));
  const sn=s.match(/1\/[\d.]+英寸/);if(sn)parts.push(sn[0]);
  if(!parts.length)return s.length<=14?s:s.slice(0,14);
  return parts.join(' ');
}

function mergeImages(base,over){
  const out={};
  new Set([...Object.keys(base||{}),...Object.keys(over||{})]).forEach(id=>{
    const m={...(base?.[id]||{}),...(over?.[id]||{})};
    Object.keys(m).forEach(k=>{if(!m[k])delete m[k]});
    if(Object.keys(m).length)out[id]=m;
  });
  return out;
}

function mapPhone(o,i){

    const six=antutuRaw.match(/\d{6,}/);
    if(six)antutu=+six[0];else{const w=antutuRaw.match(/([\d.]+)万/);if(w)antutu=Math.round(+w[1]*1e4)}

  const wirelessRaw=clean(g('无线充电'));

function buildPhones(csvText){
  const rows=parseCSV(csvText);
  if(rows.length<2)return [];
  const objs=rowsToObjects(rows);
  return objs.map((o,i)=>mapPhone(o,i)).filter(p=>p.model);
}

/* ============ 维度得分 / 全场极值 ============ */
function computeDerived(phones){
  const vals=k=>phones.map(p=>p[k]).filter(v=>v!=null&&isFinite(v));
  const st=k=>{const a=vals(k);return a.length?{min:Math.min(...a),max:Math.max(...a)}:{}};
  const norm=(v,s,inv)=>{if(v==null||!s||s.min===s.max)return null;const k=inv?(s.max-v):(v-s.min);return 8+92*k/(s.max-s.min)};
  const D={antutu:st('antutu'),gb:st('gbM'),rr:st('refreshRate'),nit:st('brightness'),ppi:st('ppi'),
    main:st('mainMP'),tele:st('teleMP'),uw:st('uwMP'),fr:st('frontMP'),
    batt:st('battery'),endu:st('endurance'),wt:st('weightG'),th:st('thickness'),price:st('price')};
  const dmax={antutu:D.antutu.max??null,battery:D.batt.max??null,wiredW:Math.max(0,...vals('wiredW'))||null,brightness:D.nit.max??null,
    mainMP:D.main.max??null,weight:D.wt.max??null,thickness:D.th.max??null,price:D.price.max??null,
    ppi:D.ppi.max??null,refresh:D.rr.max??null,wirelessW:Math.max(0,...vals('wirelessW'))||null,teleMP:D.tele.max??null};
  const wpScore=p=>{const s=p.waterproof||'';if(/IP69K/.test(s))return 100;if(/IP69/.test(s))return 88;if(/IP68/.test(s))return 72;if(/IP66/.test(s))return 58;return null};
  const avgN=(items)=>{const a=items.filter(v=>v!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
  const wavg=items=>{let s=0,w=0;for(const[v,k]of items){if(v!=null){s+=v*k;w+=k}}return w?s/w:null};
  phones.forEach(p=>{
    const gb6=p.gbM!=null&&p.gbVer!=='GB7'?p.gbM:null;
    p.perf=p.antutu!=null?norm(p.antutu,D.antutu):(gb6!=null?norm(gb6,D.gb):(p.id==='m7'?15:null));
    p.scr=avgN([norm(p.refreshRate,D.rr),norm(p.brightness,D.nit),norm(p.ppi,D.ppi)]);
    p.cam=wavg([[norm(p.mainMP,D.main),.4],[norm(p.teleMP,D.tele),.3],[norm(p.uwMP,D.uw),.2],[norm(p.frontMP,D.fr),.1]]);
    const b=norm(p.battery,D.batt),e=norm(p.endurance,D.endu);
    p.bat=(b!=null&&e!=null)?.65*b+.35*e:(b??e);
    p.des=avgN([norm(p.weightG,D.wt,true),norm(p.thickness,D.th,true),wpScore(p)]);
    p.pri=norm(p.price,D.price,true);
    [p.perf,p.scr,p.cam,p.bat,p.des,p.pri].forEach(v=>{if(v!=null)p.round?.()});
  });
  const dims=['perf','scr','cam','bat','des','pri'];
  const avg=dims.map(d=>{const a=vals(d);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0});
  return {dmax,avg,dims};
}

/* ============ 全场之最（优缺点） ============ */
function superlatives(p,all){
  const pro=[],con=[];
  const vals=k=>all.map(x=>x[k]).filter(v=>v!=null&&isFinite(v));
  const mx=k=>vals(k).length?Math.max(...vals(k)):null;
  const mn=k=>vals(k).length?Math.min(...vals(k)):null;
  const eq=(k,v)=>v!=null&&p[k]!=null&&p[k]===v;
  const price=v=>'¥'+fmtInt(v);
  if(eq('battery',mx('battery')))pro.push(`电池容量最大（${fmtInt(p.battery)}mAh）`);
  if(eq('battery',mn('battery')))con.push(`电池容量最小（${fmtInt(p.battery)}mAh）`);
  if(eq('endurance',mx('endurance')))pro.push(`实测续航最长（${p.enduranceTxt||fmtNum(p.endurance)+'h'}）`);
  if(eq('weightG',mn('weightG')))pro.push(`全场最轻（${fmtNum(p.weightG)}g）`);
  if(eq('weightG',mx('weightG')))con.push(`全场最重（${fmtNum(p.weightG)}g）`);
  if(eq('thickness',mn('thickness')))pro.push(`全场最薄（${fmtNum(p.thickness)}mm）`);
  if(eq('thickness',mx('thickness')))con.push(`全场最厚（${fmtNum(p.thickness)}mm）`);
  if(eq('price',mn('price')))pro.push(`起售价最低（${price(p.price)}）`);
  if(eq('price',mx('price')))con.push(`起售价最高（${price(p.price)}）`);
  if(eq('antutu',mx('antutu')))pro.push(`安兔兔跑分最高（${fmtInt(p.antutu)}）`);
  if(p.gbVer!=='GB7'&&eq('gbM',mx('gbM')))pro.push(`GB6 多核最高（${fmtInt(p.gbM)}）`);
  if(eq('wiredW',mx('wiredW')))pro.push(`有线充电最快（${p.wiredW}W）`);
  if(eq('wirelessW',mx('wirelessW')))pro.push(`无线充电最快（${p.wirelessW}W）`);
  if(eq('brightness',mx('brightness')))pro.push(`峰值亮度最高（${fmtInt(p.brightness)}nit）`);
  if(eq('brightness',mn('brightness')))con.push(`峰值亮度最低（${fmtInt(p.brightness)}nit）`);
  if(eq('refreshRate',mx('refreshRate')))pro.push(`刷新率最高（${p.refreshRate}Hz）`);
  if(eq('ppi',mx('ppi')))pro.push(`像素密度最高（${p.ppi} PPI）`);
  if(eq('mainMP',mx('mainMP')))pro.push(`主摄像素最高（${mpText(p.mainMP)}）`);
  if(eq('teleMP',mx('teleMP')))pro.push(`长焦像素最高（${mpText(p.teleMP)}）`);
  if(eq('screenSize',mx('screenSize')))pro.push(`屏幕最大（${fmtNum(p.screenSize)}英寸）`);
  if(/IP69K/.test(p.waterproof||''))pro.push('防护等级最高（IP69K）');
  return {pro,con};
}

function lensHTML(t){

  const F='<span class="mk-flash"></span>';
  if(t==='iqoo'||t==='redmi')return L('l1')+L('l2')+F;
  return L('l1')+L('l2')+L('l3')+F;

function mockupHTML(p,view='back'){
  const st=`--ph:${p.theme};--phA:${hexA(p.theme,.3)};--phB:${hexA(p.theme,.12)};--mkr:${p.mock.r}%`;
  const t=p.mock.t;
  if(view==='front'){
    const hole=t==='apple'?'<span class="mk-island"></span>':'<span class="mk-punch"></span>';
    return `<div class="mk mk-v-front" style="${st}"><div class="mk-frame"><div class="mk-screen">${hole}</div></div></div>`;
  }
  if(view==='back')return `<div class="mk mk-v-back" style="${st}"><div class="mk-frame mk-t-${t}"><div class="mk-sheen"></div><div class="mk-mod">${lensHTML(t)}${t==='xiaomi'?'<span class="mk-ring"></span>':''}</div></div></div>`;
  if(view==='side')return `<div class="mk mk-v-side" style="${st}"><span class="mk-sbump"></span><span class="mk-sbar"><i class="mk-sbtn a"></i><i class="mk-sbtn b"></i></span></div>`;
  if(view==='detail')return `<div class="mk mk-v-detail" style="${st}"><span class="mk-dglow"></span><div class="mk-dwrap mk-t-${t}"><div class="mk-mod">${lensHTML(t)}${t==='xiaomi'?'<span class="mk-ring"></span>':''}</div></div></div>`;
  return `<div class="ig-hero">${mockupHTML(p,'back')}${mockupHTML(p,'front')}</div>`;
}
const dimsAttr=u=>{const m=/img\/([\w-]+)\.webp/.exec(u||'');const d=m&&IMG_DIMS[m[1]];return d?` width="${d[0]}" height="${d[1]}"`:''};
function thumbHTML(p,view='back'){
  const im=App.images[p.id]||{};

  return mockupHTML(p,view);
}

/* ============ 组件：phone-selector ============ */
class PhoneSelector extends HTMLElement{
  connectedCallback(){
    if(this._ok)return;this._ok=1;
    this.slot=+this.dataset.slot;this.brand='全部';this.query='';this._kb=-1;
    this.innerHTML=`
      <button class="ps-slot" type="button" aria-haspopup="listbox" aria-expanded="false"></button>
      <div class="ps-pop" hidden>
        <div class="ps-search">${icon('search')}<input type="text" placeholder="搜索品牌 / 机型 / 芯片" aria-label="搜索机型"></div>
        <div class="ps-brands"></div>
        <ul class="ps-list" role="listbox"></ul>
      </div>`;
    this.btn=$('.ps-slot',this);this.pop=$('.ps-pop',this);
    this.input=$('input',this);this.brandBox=$('.ps-brands',this);this.listBox=$('.ps-list',this);
    this.buildBrands();this.renderSlot();this.renderList();
    this.btn.addEventListener('click',e=>{
      if(e.target.closest('.ps-x')){App.removeFromSlot(this.slot);return}
      this.open?this.close():this.show();
    });
    this.input.addEventListener('input',()=>{this.query=this.input.value;this.renderList()});
    this.input.addEventListener('keydown',e=>this.keyNav(e));
    this.listBox.addEventListener('click',e=>{
      const it=e.target.closest('.ps-item');
      if(!it||it.getAttribute('aria-disabled')==='true')return;
      const p=App.byId.get(it.dataset.id);
      if(p)this.pick(p,it);
    });
    this._doc=ev=>{if(this.open&&!this.contains(ev.target))this.close()};
    document.addEventListener('pointerdown',this._doc);
  }
  disconnectedCallback(){document.removeEventListener('pointerdown',this._doc)}
  get open(){return !this.pop.hidden}
  buildBrands(){
    const brands=[...new Set(App.phones.map(p=>p.brand))];
    this.brandBox.innerHTML=['全部',...brands].map(b=>`<button class="chip ${b===this.brand?'on':''}" data-b="${esc(b)}">${esc(b)}</button>`).join('');
    this.brandBox.onclick=e=>{const b=e.target.closest('[data-b]');if(!b)return;this.brand=b.dataset.b;this.buildBrands();this.renderList()};
  }
  renderSlot(){
    const id=App.sel[this.slot],p=id?App.byId.get(id):null;
    this.btn.classList.toggle('filled',!!p);
    this.btn.style.removeProperty('--ph');
    if(p)this.btn.style.setProperty('--ph',p.theme);
    this.btn.innerHTML=p
      ?`<span class="ps-th">${thumbHTML(p,'back')}</span><span class="ps-in"><b>${esc(p.model)}</b><span>${esc(p.brand)}${p.price?' · ¥'+fmtInt(p.price):''}</span></span><span class="ps-x" role="button" aria-label="移除">${icon('x')}</span>`
      :`<span class="ps-plus">${icon('plus')}</span><span class="ps-emp"><b>选择机型</b><span>点击挑选</span></span>`;
  }
  listData(){
    let arr=App.phones;
    if(this.brand!=='全部')arr=arr.filter(p=>p.brand===this.brand);
    const q=this.query.trim().toLowerCase();
    if(q){
      if(window.Fuse){
        if(!this._fuse||this._fn!==App.phones.length){this._fuse=new window.Fuse(App.phones,{keys:['model','brand','socShort'],threshold:.38,ignoreLocation:true});this._fn=App.phones.length}
        const ids=new Set(this._fuse.search(q).map(r=>r.item.id));arr=arr.filter(p=>ids.has(p.id));
      }else arr=arr.filter(p=>(p.model+p.brand+(p.socShort||'')).toLowerCase().includes(q));
    }
    return arr;
  }
  renderList(){
    const arr=this.listData();
    if(!arr.length){this.listBox.innerHTML='<li class="empty">没有匹配的机型</li>';return}
    this.listBox.innerHTML=arr.map(p=>{
      const usedElse=App.sel.includes(p.id)&&App.sel[this.slot]!==p.id;
      return `<li><button class="ps-item ${usedElse?'off':''}" data-id="${p.id}" role="option" aria-disabled="${usedElse}">
        <span class="ps-item-th">${thumbHTML(p,'back')}</span>
        <span class="ps-item-in"><b>${esc(p.model)}${p.statusShort==='未发布'?' <em class="badge unreleased">未发布</em>':''}</b><span>${esc(p.brand)} · ${esc(p.socShort||p.statusShort)}</span></span>
        <span class="ps-item-end">${usedElse?'已选':(p.price?'¥'+fmtInt(p.price):'—')}</span></button></li>`;
    }).join('');
    this._kb=-1;
  }
  keyNav(e){
    const items=$$('.ps-item',this.listBox);
    if(e.key==='Escape'){e.stopPropagation();this.close();return}
    if(!items.length)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      this._kb=(this._kb+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
      items.forEach((el,i)=>el.classList.toggle('kb',i===this._kb));
      items[this._kb].scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'&&this._kb>=0){e.preventDefault();items[this._kb].click()}
  }
  show(){
    this.query='';this.input.value='';this._kb=-1;
    this.pop.hidden=false;this.btn.setAttribute('aria-expanded','true');
    this.buildBrands();this.renderList();
    if(window.gsap&&!RM)gsap.fromTo(this.pop,{autoAlpha:0,y:-6,scale:.98},{autoAlpha:1,y:0,scale:1,duration:.26,ease:'power3.out',overwrite:'auto'});
    setTimeout(()=>this.input.focus(),30);
  }
  close(){
    this.btn.setAttribute('aria-expanded','false');
    if(this.open&&window.gsap&&!RM){
      const fin=()=>{this.pop.hidden=true;gsap.set(this.pop,{clearProps:'all'})};
      clearTimeout(this._ct);
      gsap.to(this.pop,{autoAlpha:0,y:-6,duration:.18,ease:'power1.in',onComplete:()=>{clearTimeout(this._ct);fin()}});
      this._ct=setTimeout(fin,260);
    }else this.pop.hidden=true;
  }
  pick(p,itemEl){
    if(App.sel.includes(p.id)&&App.sel[this.slot]!==p.id)return;
    this.close();
    App.select(this.slot,p.id,this);
    if(window.gsap&&!RM)gsap.fromTo(this.btn,{opacity:.45},{opacity:1,duration:.32,ease:'power2.out',clearProps:'opacity'});
  }
}

/* ============ 组件：compare-grid ============ */
class CompareGrid extends HTMLElement{
  connectedCallback(){
    if(this._ok)return;this._ok=1;
    this.collapsed=new Set();
    this.innerHTML=`
      <div class="cg-head">
        <h2 class="cg-title">参数对比</h2>
        <diff-toggle></diff-toggle>
        <span class="cg-spacer"></span>
        <div class="cg-sort" role="group" aria-label="列排序"><span>列排序</span>
          <button class="chip on" data-s="default">选择顺序</button>
          <button class="chip" data-s="price">价格</button>
          <button class="chip" data-s="antutu">跑分</button>
          <button class="chip" data-s="battery">电池</button>
          <button class="chip" data-s="weight">重量</button>
        </div>
      </div>
      <div class="cg-wrap"><div class="cg-grid"></div></div>`;
    this.grid=$('.cg-grid',this);
    this.sortBox=$('.cg-sort',this);
    this.dtog=$('diff-toggle',this);
    this.sortBox.addEventListener('click',e=>{const c=e.target.closest('[data-s]');if(c)App.setSort(c.dataset.s)});
    this.dtog.addEventListener('toggle',e=>App.setDiff(e.detail));
    this.grid.addEventListener('click',e=>{
      const x=e.target.closest('.cg-ph-x');
      if(x){App.removeFromSlotByPhone(x.dataset.x);return}
      const g=e.target.closest('.cg-group');
      if(g){const name=g.dataset.g;this.collapsed.has(name)?this.collapsed.delete(name):this.collapsed.add(name);this.render({});return}
      const ph=e.target.closest('.cg-ph');
      if(ph)App.openDrawer(ph.dataset.id);
    });
  }
  sync(diff,sort){
    this.dtog.on=diff;
    $$('[data-s]',this.sortBox).forEach(c=>c.classList.toggle('on',c.dataset.s===sort));
  }
  update(list,opt={}){this.list=list;this.render(opt)}
  buildHTML(list,diff){
    const n=list.length;
    this.grid.style.setProperty('--cols',`132px repeat(${n},minmax(168px,1fr))`);
    let h=`<div class="cg-corner" data-fk="corner">参数</div>`;
    h+=list.map(p=>`<div class="cg-ph" data-fk="h:${p.id}" data-id="${p.id}" style="--ph:${p.theme}" title="查看 ${esc(p.model)} 详情">
      <span class="cg-ph-th">${thumbHTML(p,'back')}</span>
      <span class="cg-ph-in"><b>${esc(p.model)}</b><span>${p.price?'¥'+fmtInt(p.price):'—'}</span></span>
      <button class="cg-ph-x" data-x="${p.id}" aria-label="移除">${icon('x')}</button></div>`).join('');
    for(const G of GROUPS){
      const col=this.collapsed.has(G.g);
      h+=`<div class="cg-group ${col?'col':''}" data-fk="g:${G.g}" data-g="${G.g}" style="grid-column:1/-1"><span>${G.g}</span>${icon('chevr')}</div>`;
      if(col)continue;
      for(const row of G.rows){
        const cells=list.map(p=>({p,t:(row.s&&row.s(p))??(row.v?row.v(p):null),n:row.n?row.n(p):null}));
        cells.forEach(c=>{if(c.t==null)c.t=null});
        if(diff&&new Set(cells.map(c=>c.t??'—')).size<2)continue;
        h+=`<div class="cg-label" data-fk="r:${row.k}">${row.l}</div>`;
        const nums=cells.map(c=>c.n).filter(v=>v!=null);
        const mx=nums.length?Math.max(...nums):0,mn=nums.length?Math.min(...nums):0;
        for(const c of cells){
          let cls='',w=0;
          if(c.n!=null){
            if(nums.length>=2&&mx!==mn){
              const best=row.lb?c.n===mn:c.n===mx,worst=row.lb?c.n===mx:c.n===mn;
              cls=best?'best':(worst?'worst':'');
            }
            w=mx>0?Math.max(3,Math.round(c.n/mx*100)):0;
          }
          const full=row.v?row.v(c.p):null;
          h+=`<div class="cg-cell ${cls}${row.wide?' wide':''}" data-fk="c:${row.k}@${c.p.id}" style="--ph:${c.p.theme}" title="${esc(full??c.t??'')}">
            <span class="cg-val">${esc(c.t??'—')}</span>${c.n!=null&&w?`<span class="cg-bar"><i data-w="${w}"></i></span>`:''}</div>`;
        }
      }
    }
    return h;
  }
  render({removed=[],diff=false}={}){
    this.diff=diff;
    const doRender=()=>{
      if(!this.list||!this.list.length){this.grid.innerHTML='<div class="cg-empty">从上方选择机型开始对比</div>';return}
      const before=new Map();
      $$('[data-fk]',this.grid).forEach(el=>before.set(el.dataset.fk,el.getBoundingClientRect()));
      this.grid.innerHTML=this.buildHTML(this.list,diff);
      const bars=()=>$$('.cg-bar i',this.grid).forEach(i=>{i.style.transform=`scaleX(${(i.dataset.w||0)/100})`});
      requestAnimationFrame(bars);setTimeout(bars,180);
      if(window.gsap&&!RM){
        let n=0;
        $$('[data-fk]',this.grid).forEach(el=>{
          const old=before.get(el.dataset.fk);
          if(!old){gsap.from(el,{opacity:0,y:10,duration:.3,delay:.04+Math.min(n*.02,.12),ease:'power2.out',overwrite:'auto',clearProps:'opacity,transform'});n++;return}
          const now=el.getBoundingClientRect(),dx=old.left-now.left,dy=old.top-now.top;
          if(Math.abs(dx)>1||Math.abs(dy)>1)gsap.fromTo(el,{x:dx,y:dy},{x:0,y:0,duration:.36,ease:'power3.out',overwrite:'auto',clearProps:'transform'});
        });
      }
    };
    if(removed.length&&window.gsap&&!RM){
      const sel=removed.map(id=>`[data-fk$="@${id}"],[data-fk="h:${id}"]`).join(',');
      const els=$$(sel,this.grid);
      if(els.length){
        let _f=0;const once=()=>{if(_f++)return;doRender()};
        gsap.to(els,{opacity:0,x:-14,duration:.2,ease:'power1.in',onComplete:once});
        setTimeout(once,300);return;
      }
    }
    doRender();
  }
}

/* ============ 组件：图库 ============ */
const VIEWS=[{k:'main',l:'主图'},{k:'front',l:'正面'},{k:'back',l:'背面'},{k:'side',l:'侧面'},{k:'detail',l:'细节'}];
function swipeable(el,onNext,onPrev){
  let sx=0,dx=0,lx=0,lt=0,vel=0,active=false,moved=false;
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    active=true;moved=false;sx=e.clientX;lx=sx;lt=performance.now();vel=0;
    el.setPointerCapture(e.pointerId);el.classList.add('grabbing');
  });
  el.addEventListener('pointermove',e=>{
    if(!active)return;
    dx=e.clientX-sx;
    if(Math.abs(dx)>6)moved=true;
    const t=performance.now();vel=(e.clientX-lx)/Math.max(1,t-lt);lx=e.clientX;lt=t;
    el.style.setProperty('--drag',dx+'px');
  });
  const end=()=>{
    if(!active)return;active=false;el.classList.remove('grabbing');
    el.style.setProperty('--drag','0px');
    if(dx<-56||vel<-.55)onNext();
    else if(dx>56||vel>.55)onPrev();
    else if(!moved)el.dispatchEvent(new CustomEvent('tap'));
    dx=0;
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}
class ImageGallery extends HTMLElement{

    this.innerHTML=`

    $('.ig-prev',this).addEventListener('click',()=>this.go(this.i-1));
    $('.ig-next',this).addEventListener('click',()=>this.go(this.i+1));
    $('.ig-rep',this).addEventListener('click',()=>{
      this.repp.hidden=!this.repp.hidden;
      if(!this.repp.hidden){
        const imgs=App.images[this.phone.id]||{};
        $$('input',this.repp).forEach(inp=>inp.value=imgs[inp.dataset.v]||'');
      }
    });
    $('.ig-save',this).addEventListener('click',()=>{
      const obj={};$$('input',this.repp).forEach(inp=>{const v=inp.value.trim();if(v)obj[inp.dataset.v]=v});
      App.setImage(this.phone.id,obj);this.repp.hidden=true;toast('图片已更新');
    });
    $('.ig-clear',this).addEventListener('click',()=>{App.setImage(this.phone.id,null);this.repp.hidden=true;this.paint(true);toast('已恢复示意图')});
    this.stage.addEventListener('tap',()=>App.openLB(this.phone,this.i));
    swipeable(this.stage,()=>this.go(this.i+1),()=>this.go(this.i-1));
    this.stage.addEventListener('keydown',e=>{
      if(e.key==='ArrowLeft')this.go(this.i-1);
      if(e.key==='ArrowRight')this.go(this.i+1);
    });
  }
  setPhone(p){this.phone=p;this.i=0;for(let x=0;x<VIEWS.length;x++){if(this.url(VIEWS[x].k)){this.i=x;break}}this.repp.hidden=true;this.paint(true);this.tabs()}
  tabs(){$$('.ig-tab',this).forEach((t,x)=>t.classList.toggle('on',x===this.i))}
  url(k){return (App.images[this.phone.id]||{})[k]}
  stageHTML(){
    const p=this.phone,v=VIEWS[this.i],url=this.url(v.k);
    if(url)return `<div class="ig-imgw"><img class="ig-img" src="${esc(url)}"${dimsAttr(url)} alt="${esc(p.model)} ${v.l}" decoding="async"></div>`;
    return mockupHTML(p,v.k)+'<span class="ig-noimg">暂无真实图片 · 点击右上角替换</span>';
  }
  bindImg(){
    const img=$('.ig-img',this.stage);
    if(!img)return;
    const ok=()=>img.classList.add('ok');
    if(img.complete&&img.naturalWidth)ok();else img.addEventListener('load',ok,{once:true});
    img.addEventListener('error',()=>{
      App.setImage(this.phone.id,{[VIEWS[this.i].k]:null});
      this.paint(true);toast('图片加载失败，已回退');
    },{once:true});
  }
  paint(instant){
    this.stage.innerHTML=this.stageHTML();this.bindImg();this.tabs();this.preload();
    if(instant||!window.gsap||RM)return;
    gsap.fromTo(this.stage,{opacity:0,x:22},{opacity:1,x:0,duration:.32,ease:'power3.out',clearProps:'transform,opacity'});
  }
  preload(){
    VIEWS.forEach(v=>{const u=this.url(v.k);if(u){const im=new Image();im.src=u}});
  }
  go(n){
    this.i=(n+VIEWS.length)%VIEWS.length;
    this.paint(false);
  }
}

/* ============ 应用 ============ */
const App={
  phones:[],byId:new Map(),dmax:{},avg:[],
  sel:[null,null,null],diff:false,sort:'default',images:{},
  init(){
    this.images=mergeImages(DEFAULT_IMGS,LS.get('img',{}));
    /* rAF 停摆兜底：窗口后台化/省电模式下 rAF 冻结会让 GSAP 动画卡在起始帧（元素隐形、回调不执行），
       检测到前台但 rAF 超时未跑时，把所有动画直接推到终点并触发回调 */
    if(window.gsap&&window.requestAnimationFrame){
      let lastRaf=performance.now();
      (function beat(){lastRaf=performance.now();requestAnimationFrame(beat)})();
      setInterval(()=>{
        if(!document.hidden&&performance.now()-lastRaf>1500){
          gsap.globalTimeline.getChildren(true,true,true).forEach(t=>{try{t.progress(1)}catch(e){}});
          lastRaf=performance.now();
        }
      },1200);
    }
    const custom=LS.get('csv',null);
    this.setData(custom||RAW_CSV);
    const saved=LS.get('sel',null);
    this.sel=saved&&Array.isArray(saved)?saved.map(id=>id&&this.byId.has(id)?id:null):['m1','m4','m3'].map(id=>this.byId.has(id)?id:null);
    this.diff=!!LS.get('diff',false);
    this.sort=LS.get('sort','default');
    $('#btnImport').addEventListener('click',()=>$('#fileCsv').click());
    $('#fileCsv').addEventListener('change',e=>{
      const f=e.target.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{try{this.importCSV(String(rd.result))}catch(err){toast('CSV 解析失败：需包含 机型 与 品牌 列')}e.target.value=''};
      rd.readAsText(f,'utf-8');
    });
    $('#btnReset').addEventListener('click',()=>{LS.del('csv');this.setData(RAW_CSV);this.afterData();$('#btnReset').hidden=true;toast('已恢复内置数据')});
    const applyTheme=t=>{document.documentElement.dataset.theme=t;LS.set('theme',t);$('#btnTheme').innerHTML=icon(t==='light'?'moon':'sun');document.dispatchEvent(new CustomEvent('themechange'))};
    const setTheme=t=>{
      if(!document.startViewTransition||RM)return applyTheme(t);
      const r=$('#btnTheme').getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
      const tr=document.startViewTransition(()=>applyTheme(t));
      tr.ready.then(()=>{
        const R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
        document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},{duration:520,easing:'cubic-bezier(.4,0,.2,1)',pseudoElement:'::view-transition-new(root)'});
      }).catch(()=>{});
    };
    const qp=new URLSearchParams(location.search).get('theme');
    applyTheme(qp==='light'||qp==='dark'?qp:LS.get('theme','dark'));
    $('#btnTheme').addEventListener('click',()=>setTheme(LS.get('theme','dark')==='light'?'dark':'light'));
    const chartRefresh=()=>$$('radar-chart,bar-chart,donut-chart').forEach(el=>el.refresh&&el.refresh());
    document.addEventListener('themechange',chartRefresh);
    document.addEventListener('lib:chart',chartRefresh);
    this.renderAll();
    $('#cards').addEventListener('mouseover',e=>{
      const c=e.target.closest&&e.target.closest('.card');if(!c||c._warm)return;c._warm=1;
      const p=this.byId.get(c.dataset.id);if(!p)return;
      Object.values(this.images[p.id]||{}).forEach(u=>{const i=new Image();i.src=u});
    },{passive:true});
    const dm=location.hash.match(/#d=([\w-]+)/);
    if(dm&&this.byId.has(dm[1]))this.openDrawer(dm[1]);
    entrance();
    document.documentElement.classList.remove('boot');
    if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  },
  importCSV(text){
    const phones=buildPhones(text);
    if(!phones.length)throw new Error('empty');
    LS.set('csv',text);
    this.setData(text);
    this.afterData();
    $('#btnReset').hidden=false;
    toast(`已导入 ${phones.length} 款机型`);
  },
  afterData(){
    this.sel=this.sel.map(id=>id&&this.byId.has(id)?id:null);
    this.renderAll();
  },
  setData(csvText){
    this.phones=buildPhones(csvText);
    this.byId=new Map(this.phones.map(p=>[p.id,p]));
    const {dmax,avg}=computeDerived(this.phones);
    this.dmax=dmax;this.avg=avg;
    $('#subLine').textContent=`${this.phones.length} 款机型 · 数据来自本地 CSV`;
    $('#gSub').textContent=`在售 ${this.phones.filter(p=>p.statusShort==='在售').length} 款 · 未发布 ${this.phones.filter(p=>p.statusShort==='未发布').length} 款 · 点击卡片查看详情`;
  },
  ordered(){
    const arr=this.sel.filter(Boolean).map(id=>this.byId.get(id));
    const cmp={
      price:(a,b)=>(a.price??1e12)-(b.price??1e12),
      antutu:(a,b)=>(b.antutu??0)-(a.antutu??0),
      battery:(a,b)=>(b.battery??0)-(a.battery??0),
      weight:(a,b)=>(a.weightG??1e12)-(b.weightG??1e12)
    }[this.sort];
    return cmp?[...arr].sort(cmp):arr;
  },
  renderAll(){
    $$('#secCompare compare-grid').forEach(c=>{});
    const cmp=$('#cmp');
    cmp.sync(this.diff,this.sort);
    const list=this.ordered();
    $('#secCompare').hidden=!list.length;
    cmp.update(list,{diff:this.diff});
    $$('.tl-bar phone-selector').forEach(el=>{el.renderSlot();el.buildBrands()});
    this.renderGallery();
    $('#btnReset').hidden=!LS.get('csv',null);
  },
  renderGallery(){
    const box=$('#cards');
    box.innerHTML=this.phones.map(p=>{
      const on=this.sel.includes(p.id);
      const chips=[
        p.antutu!=null?`跑分 ${wan(p.antutu)}`:null,
        p.battery!=null?`${fmtInt(p.battery)}mAh`:null,
        p.weightG!=null?`${fmtNum(p.weightG)}g`:null
      ].filter(Boolean).slice(0,3).map(c=>`<span>${c}</span>`).join('');
      const badge=p.statusShort==='未发布'?'<span class="badge unreleased card-badge">未发布</span>':p.statusShort==='已停产'?'<span class="badge eol card-badge">已停产</span>':'';
      return `<article class="card" data-id="${p.id}" style="--ph:${p.theme}" tabindex="0" role="button" aria-label="查看 ${esc(p.model)} 详情">
        <div class="card-media">${thumbHTML(p,'back')}${badge}
          <button class="card-add ${on?'on':''}" title="${on?'已在对比中':'加入对比'}" aria-label="加入对比">${icon(on?'check':'plus')}</button></div>
        <div class="card-body">
          <h3 class="card-name">${esc(p.model)}</h3>
          <p class="card-meta">${esc(p.brand)} · ${esc(p.releaseShort||p.statusShort)}</p>
          <p class="card-price">${p.price!=null?'¥'+fmtInt(p.price):'—'}${p.currentPrice!=null&&p.price!=null&&p.currentPrice<p.price?`<span class="card-now">到手 ¥${fmtInt(p.currentPrice)}</span>`:''}</p>
          <div class="card-chips">${chips}</div>
        </div></article>`;
    }).join('');
  },
  select(slot,id,fromEl){
    if(this.sel.includes(id)){toast('该机型已在对比中');return}
    this.sel[slot]=id;LS.set('sel',this.sel);
    const cmp=$('#cmp');
    cmp.update(this.ordered(),{diff:this.diff});
    $('#secCompare').hidden=!this.ordered().length;
    $$('.tl-bar phone-selector').forEach(el=>el.renderSlot());
    this.renderGallery();
    const btn=$$('.tl-bar phone-selector')[slot];
    if(btn){btn.classList.add('flash');setTimeout(()=>btn.classList.remove('flash'),700)}
  },
  removeFromSlot(slot){
    const id=this.sel[slot];if(!id)return;
    this.sel[slot]=null;LS.set('sel',this.sel);
    const cmp=$('#cmp');
    cmp.update(this.ordered(),{removed:[id],diff:this.diff});
    $('#secCompare').hidden=!this.ordered().length;
    $$('.tl-bar phone-selector').forEach(el=>el.renderSlot());
    this.renderGallery();
  },
  removeFromSlotByPhone(id){
    const i=this.sel.indexOf(id);if(i>=0)this.removeFromSlot(i);
  },
  setSort(k){this.sort=k;LS.set('sort',k);$('#cmp').sync(this.diff,k);$('#cmp').update(this.ordered(),{diff:this.diff})},
  setDiff(b){this.diff=b;LS.set('diff',b);$('#cmp').sync(b,this.sort);$('#cmp').update(this.ordered(),{diff:b})},
  setImage(id,obj){
    if(obj===null)delete this.images[id];
    else this.images[id]={...(this.images[id]||{}),...obj};
    Object.keys(this.images[id]||{}).forEach(k=>{if(!this.images[id][k])delete this.images[id][k]});
    if(this.images[id]&&!Object.keys(this.images[id]).length)delete this.images[id];
    LS.set('img',this.images);
    this.renderGallery();
    $$('.tl-bar phone-selector').forEach(el=>el.renderSlot());
  },
  openDrawer(id){
    const p=this.byId.get(id);if(!p)return;
    $('#drawer').open(p);
  },
  switchDrawer(id){
    const p=this.byId.get(id);if(!p)return;
    const dr=$('#drawer');dr.fill(p);
    if(window.gsap&&!RM)gsap.fromTo($('.dd-scroll',dr),{opacity:.35},{opacity:1,duration:.28,ease:'power1.out',clearProps:'opacity'});
  },
  closeDrawer(){$('#drawer').close()},
  get drawerOpen(){return !$('#drawer').hidden},
  openLB:(p,i)=>openLB(p,i),
  closeLB:()=>closeLB()
};

/* 卡片交互 + 3D 倾斜 */
$('#cards').addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const add=e.target.closest('.card-add');
  if(add){
    if(App.sel.includes(card.dataset.id)){toast('该机型已在对比中');return}
    let slot=App.sel.findIndex(x=>!x);if(slot<0)slot=2;
    App.select(slot,card.dataset.id,card);
    return;
  }
  App.openDrawer(card.dataset.id);
});
$('#cards').addEventListener('keydown',e=>{
  const card=e.target.closest('.card');
  if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();App.openDrawer(card.dataset.id)}
});
if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!RM){
  /* 卡片 3D 倾斜：rAF 合帧 + 缓存卡片矩形，避免每个 pointermove 都强制布局 */
  let hov=null,rect=null,raf=0,mx=0,my=0;
  const apply=()=>{
    raf=0;
    if(!hov)return;
    const x=(mx-rect.left)/rect.width,y=(my-rect.top)/rect.height;
    hov.style.setProperty('--gx',x*100+'%');hov.style.setProperty('--gy',y*100+'%');
    hov.style.transition='transform .12s ease-out';
    hov.style.transform=`perspective(900px) rotateX(${(0.5-y)*7}deg) rotateY(${(x-0.5)*9}deg) translateY(-4px)`;
  };
  const track=e=>{
    const card=e.target.closest('.card');
    if(card!==hov){hov=card;rect=card?card.getBoundingClientRect():null}
    return card;
  };
  $('#cards').addEventListener('pointermove',e=>{
    if(!track(e))return;
    mx=e.clientX;my=e.clientY;
    if(!raf)raf=requestAnimationFrame(apply);
  });
  $('#cards').addEventListener('pointerout',e=>{
    const card=e.target.closest('.card');
    if(card&&card===hov&&!card.contains(e.relatedTarget)){
      if(raf){cancelAnimationFrame(raf);raf=0}
      hov=null;
      card.style.transition='';card.style.transform='';
    }
  });
}

/* 全局键盘 */
document.addEventListener('keydown',e=>{
  const inInput=/^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if(e.key==='Escape'){
    if(!lb.hidden){closeLB();return}
    if(App.drawerOpen){App.closeDrawer();return}
    if(!inInput)$$('.tl-bar phone-selector').forEach(el=>el.open&&el.close());
    return;
  }
  if(inInput)return;
  if(!lb.hidden){
    if(e.key==='ArrowLeft')lbGo(lbI-1);
    if(e.key==='ArrowRight')lbGo(lbI+1);
    return;
  }
  if(App.drawerOpen){
    if(e.key==='ArrowLeft')$('#drawer').nav(-1);
    if(e.key==='ArrowRight')$('#drawer').nav(1);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      const dr=$('#drawer'),p=dr.phone;
      if(p){const list=App.ordered(),i=list.findIndex(x=>x.id===p.id),j=e.key==='ArrowDown'?i+1:i-1;
        if(j>=0&&j<list.length)App.switchDrawer(list[j].id)}
    }
  }
});

/* 入场动画 */
function entrance(){
  if(!window.gsap||RM)return;
  const tl=gsap.timeline({defaults:{ease:'power3.out',clearProps:'all'}});
  tl.from('.app-header',{y:-18,opacity:0,duration:.6})
    .from('.tl-bar phone-selector',{y:26,opacity:0,duration:.55,stagger:.07},'-=.32')
    .from('#secCompare',{y:18,opacity:0,duration:.55},'-=.34')
    .from('.card',{y:26,opacity:0,duration:.55,stagger:.045},'-=.36')
    .from('.app-footer',{opacity:0,duration:.5},'-=.3');
}
